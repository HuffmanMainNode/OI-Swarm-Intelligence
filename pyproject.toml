[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oi-swarm-intelligence"
version = "0.1.0"
description = "Policy-gated capability planning for local Open Intelligence swarms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
oi-swarm-plan = "oi_swarm.planner:main"

[tool.setuptools.packages.find]
where = ["src"]
